<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Body Simulation</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4 text-center">N-Body Simulation</h1>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Simulation Visualization</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="canvas-container">
                            <canvas id="simulation-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Controls</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="num-bodies-slider" class="form-label">Number of Bodies: <span id="num-bodies-value">4</span></label>
                            <input type="range" class="form-range" id="num-bodies-slider" min="2" max="10" value="4">
                        </div>
                        
                        <div class="mb-3">
                            <label for="time-steps-slider" class="form-label">Time Steps: <span id="time-steps-value">5000</span></label>
                            <input type="range" class="form-range" id="time-steps-slider" min="1000" max="10000" step="1000" value="5000">
                        </div>
                        
                        <div class="mb-3">
                            <label for="dt-slider" class="form-label">Time Step Size (dt): <span id="dt-value">0.01</span></label>
                            <input type="range" class="form-range" id="dt-slider" min="0.001" max="0.05" step="0.001" value="0.01">
                        </div>
                        
                        <div class="mb-3">
                            <label for="boundary-slider" class="form-label">Boundary Size: <span id="boundary-value">20</span></label>
                            <input type="range" class="form-range" id="boundary-slider" min="10" max="50" step="5" value="20">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button id="start-button" class="btn btn-primary">Start Simulation</button>
                            <button id="stop-button" class="btn btn-secondary" disabled>Stop Simulation</button>
                            <button id="reset-button" class="btn btn-outline-secondary">Reset</button>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Playback Controls</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <button id="play-pause-button" class="btn btn-sm btn-secondary" disabled>
                                <i class="bi bi-play-fill"></i> Play
                            </button>
                            <div>
                                <span>Frame: </span>
                                <span id="current-frame">0</span>
                                <span> / </span>
                                <span id="total-frames">0</span>
                            </div>
                            <div>
                                <span>FPS: </span>
                                <span id="fps-counter">0</span>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="playback-speed" class="form-label">Speed: <span id="playback-speed-value">1x</span></label>
                            <input type="range" class="form-range" id="playback-speed" min="0.25" max="3" step="0.25" value="1">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/simulation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/controls.js') }}"></script>
</body>
</html>
